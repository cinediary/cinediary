name: Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contract:
              - 'docs/architecture/openapi-v1.yaml'
              - 'cinediary-mobile/src/shared/api/schema.d.ts'
              - 'cinediary-mobile/package.json'
              - '.github/workflows/contract.yml'

  contract:
    name: api-contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: cinediary-mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm run api:types
      - name: Check schema.d.ts is up to date with openapi-v1.yaml
        run: |
          if ! git diff --exit-code src/shared/api/schema.d.ts; then
            echo "::error file=cinediary-mobile/src/shared/api/schema.d.ts::API types are out of date. Run 'npm run api:types' in cinediary-mobile/ and commit schema.d.ts."
            exit 1
          fi
