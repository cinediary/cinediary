spring:
  application:
    name: cinediary-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinediary}
    username: ${DB_USER:cinediary}
    password: ${DB_PASSWORD:cinediary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é do Flyway; o Hibernate só confere se as entidades batem
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  modulith:
    # Módulos = pacotes anotados com @ApplicationModule (modules.<modulo> e shared), não os subpacotes da raiz.
    detection-strategy: explicitly-annotated
    events:
      # Outbox nativo: event_publication (V4). Reenvia o que ficou pendente quando a API sobe.
      republish-outstanding-events-on-restart: ${EVENTS_REPUBLISH_ON_RESTART:true}
      completion-mode: update
  servlet:
    multipart:
      max-file-size: 20MB      # ADR-05: ZIP do Letterboxd até 20 MB
      max-request-size: 21MB

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

cinediary:
  app:
    # Base do link de convite do Taste Match (deep link do app)
    invite-base-url: ${INVITE_BASE_URL:cinediary://match/invite/}
  neo4j:
    enabled: ${NEO4J_ENABLED:true}
    uri: ${NEO4J_URI:bolt://localhost:7687}
    username: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:cinediary-neo4j}
  events:
    # Reenvio de publicações incompletas do Spring Modulith (ex.: Neo4j estava fora do ar)
    resubmit-enabled: ${EVENTS_RESUBMIT_ENABLED:true}
    resubmit-interval: 30s
    resubmit-older-than: 30s
  importing:
    max-zip-bytes: 20971520
    max-uncompressed-bytes: 104857600
    max-entries: 1000 # cada lista do Letterboxd é um arquivo no ZIP (#55)
    max-items: 20000
    tmdb-parallelism: 8
    short-link-base-url: https://boxd.it
  cors:
    # Só afeta navegador (Expo web). Padrões separados por vírgula; vazio = nenhuma origem externa.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  clerk:
    # Frontend API da instância do Clerk (issuer dos JWTs). Vazio = todas as rotas autenticadas retornam 401.
    issuer: ${CLERK_ISSUER:}
    # Origens aceitas no claim "azp" (ex.: http://localhost:8081). Vazio = não valida azp.
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}
    webhook-secret: ${CLERK_WEBHOOK_SECRET:}
  tmdb:
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    image-base-url: https://image.tmdb.org/t/p
    api-token: ${TMDB_API_TOKEN:}
    language: pt-BR
    region: BR
    details-ttl: 7d
    connect-timeout: 3s
    read-timeout: 8s
