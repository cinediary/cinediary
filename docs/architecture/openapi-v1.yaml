openapi: 3.1.0
info:
  title: CineDiary API (Clean Architecture v2.0 + Neo4j GDS)
  version: 2.0.0
  description: >
    Contrato oficial da API REST do CineDiary v2.0 (Monólito Modular com Clean Architecture,
    PostgreSQL 17, Outbox Pattern e Neo4j + Graph Data Science para o Taste Match).

    Idioma do conteúdo: o cabeçalho Accept-Language (o idioma do aparelho) escolhe o idioma dos dados do
    TMDB (títulos, sinopses, gêneros, temporadas e episódios). "en…" devolve em inglês; "pt…", outro idioma
    ou sem cabeçalho devolvem em PT-BR. Os campos continuam com os mesmos nomes (titlePt, overviewPt).
servers:
  - url: http://localhost:8080
    description: Ambiente de Desenvolvimento Local
security:
  - BearerAuth: []

tags:
  - name: Users & Onboarding
    description: Sincronização Clerk via Svix, perfil, privacidade e onboarding cinematográfico sem mínimo obrigatório
  - name: Catalog (TMDB)
    description: Busca unificada, populares, gêneros e metadados de filmes e séries em PT-BR com cache local
  - name: Diary & Series
    description: Registro em até 3 toques, avaliações, reviews, watchlist e progresso de séries
  - name: Importing (Letterboxd)
    description: Upload assíncrono e confirmação idempotente do arquivo ZIP do Letterboxd
  - name: Taste Match (Neo4j + GDS)
    description: Convites, compatibilidade calculada no grafo com Neo4j + GDS, Match Story de 8 slides 9:16 e watchlist compartilhada
  - name: Stats
    description: Estatísticas gratuitas do perfil

paths:
  /api/v1/webhooks/clerk:
    post:
      tags: [Users & Onboarding]
      summary: Recebe webhooks do Clerk validados via Svix (Idempotente)
      security: []
      parameters:
        - in: header
          name: svix-id
          required: true
          schema:
            type: string
        - in: header
          name: svix-timestamp
          required: true
          schema:
            type: string
        - in: header
          name: svix-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Evento processado ou ignorado por idempotência
        '400':
          description: Assinatura Svix inválida

  /api/v1/me:
    get:
      tags: [Users & Onboarding]
      summary: Obtém o perfil do usuário autenticado
      responses:
        '200':
          description: Perfil retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    patch:
      tags: [Users & Onboarding]
      summary: Atualiza nome, @username, foto, privacidade e favoritos do perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/me/header:
    put:
      tags: [Users & Onboarding]
      summary: "Define a capa do perfil: um backdrop do TMDB de um título (sem upload)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHeaderRequest'
      responses:
        '200':
          description: Perfil com a capa nova
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: "A imagem não é um dos backdrops do título"
        '404':
          description: "Título não encontrado no catálogo"
    delete:
      tags: [Users & Onboarding]
      summary: Remove a capa do perfil
      responses:
        '200':
          description: Perfil sem capa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/me/onboarding:
    post:
      tags: [Users & Onboarding]
      summary: Conclui o onboarding cinematográfico (0 ou mais gêneros/títulos — suporta 'Pular por agora')
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: Onboarding concluído e sincronizado via Outbox com o Neo4j
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'

  /api/v1/users/{username}:
    get:
      tags: [Social]
      summary: "Perfil de alguém (privado e sem seguir: só nome, foto e contadores)"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
      responses:
        '200':
          description: "Perfil com contadores e a relação de quem vê"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfileResponse' }
        '404': { description: "Perfil não encontrado" }

  /api/v1/users/{username}/diary:
    get:
      tags: [Social]
      summary: "Diário de alguém, mais recentes primeiro (403 se privado e você não segue)"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: "Entradas (mesmo formato do seu diário)"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DiaryEntryResponse' } }
        '403': { description: "Perfil privado" }

  /api/v1/users/{username}/diary/{entryId}:
    get:
      tags: [Social]
      summary: "Uma entrada do diário de alguém"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "A entrada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntryResponse' }
        '403': { description: "Perfil privado" }
        '404': { description: "Não encontrada" }

  /api/v1/users/{username}/follow:
    post:
      tags: [Social]
      summary: "Seguir (perfil privado: vira pedido, REQUESTED)"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
      responses:
        '200':
          description: "Relação depois de seguir"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationshipResponse' }
        '400': { description: "Seguir a si mesmo" }
    delete:
      tags: [Social]
      summary: "Deixar de seguir ou cancelar o pedido"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
      responses:
        '200':
          description: "Relação depois de deixar de seguir"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationshipResponse' }

  /api/v1/users/{username}/followers:
    get:
      tags: [Social]
      summary: "Seguidores de alguém"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: "Pessoas"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SocialPersonResponse' } }
        '403': { description: "Perfil privado" }

  /api/v1/users/{username}/following:
    get:
      tags: [Social]
      summary: "Quem alguém segue"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: "Pessoas"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SocialPersonResponse' } }
        '403': { description: "Perfil privado" }

  /api/v1/people/search:
    get:
      tags: [Social]
      summary: "Busca de pessoas por @ ou nome (mínimo 2 letras)"
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
      responses:
        '200':
          description: "Até 20 pessoas"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SocialPersonResponse' } }

  /api/v1/me/follow-requests:
    get:
      tags: [Social]
      summary: "Pedidos para te seguir esperando aprovação (perfil privado)"
      responses:
        '200':
          description: "Pessoas que pediram, mais antigas primeiro"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SocialPersonResponse' } }

  /api/v1/me/follow-requests/{userId}/approve:
    post:
      tags: [Social]
      summary: "Aprovar um pedido para te seguir"
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: "Aprovado" }

  /api/v1/me/follow-requests/{userId}:
    delete:
      tags: [Social]
      summary: "Recusar um pedido para te seguir"
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: "Recusado" }

  /api/v1/me/followers/{userId}:
    delete:
      tags: [Social]
      summary: "Tirar alguém dos seus seguidores"
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: "Removido" }

  /api/v1/entries/{entryId}/interactions:
    get:
      tags: [Social]
      summary: "Curtidas (e se você curtiu) e número de respostas de uma entrada"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Números"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryInteractionsResponse' }
        '403': { description: "Perfil privado" }

  /api/v1/entries/{entryId}/companions:
    get:
      tags: [Social]
      summary: "Quem viu junto (\"vi com…\"). O dono vê também quem ainda não aceitou; os outros, só quem aceitou"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Marcações"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryCompanionsResponse' }
        '403': { description: "Perfil privado" }
    put:
      tags: [Social]
      summary: "Define quem viu junto (só o dono; só amigos: segue e é seguido). Quem entra é avisado; quem sai perde a marcação"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames: { type: array, maxItems: 10, items: { type: string }, description: "A lista inteira, por @. Vazia tira todas" }
      responses:
        '200':
          description: "Marcações depois de salvar"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryCompanionsResponse' }
        '403': { description: "Não é o dono, ou alguém não é amigo" }

  /api/v1/me/companions/{entryId}/accept:
    post:
      tags: [Social]
      summary: "Aceitar a marcação: aparece no registro"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Marcações do registro"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryCompanionsResponse' }
        '404': { description: "Sem marcação (ou já recusada)" }

  /api/v1/me/companions/{entryId}/logged:
    post:
      tags: [Social]
      summary: "Você (marcado e aceito) registrou o mesmo título: seu registro ganha \"vi com\" quem te marcou, já aceito e sem aviso"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid }, description: "O registro de quem te marcou" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId]
              properties:
                entryId: { type: string, format: uuid, description: "O seu registro do mesmo título" }
      responses:
        '200':
          description: "Marcações do seu registro (só quem te marcou)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryCompanionsResponse' }
        '404': { description: "Você não aceitou a marcação" }

  /api/v1/me/companions/{entryId}/decline:
    post:
      tags: [Social]
      summary: "Recusar a marcação (quem marcou não é avisado)"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: "Recusada" }
        '404': { description: "Sem marcação" }

  /api/v1/me/companions/{entryId}:
    delete:
      tags: [Social]
      summary: "Tirar uma marcação já aceita"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: "Tirada" }
        '404': { description: "Sem marcação" }

  /api/v1/me/friends:
    get:
      tags: [Social]
      summary: "Seus amigos (segue e é seguido), para o \"Vi com…\""
      parameters:
        - { in: query, name: q, required: false, schema: { type: string }, description: "Começo do @ ou do nome" }
      responses:
        '200':
          description: "Até 20 amigos"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FeedAuthor' } }

  /api/v1/users/{username}/watched-with:
    get:
      tags: [Social]
      summary: "Registros em que a pessoa foi marcada e aceitou (403 se privado e você não segue)"
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: "Entradas (mesmo formato do diário); só as que você pode ver"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DiaryEntryResponse' } }
        '403': { description: "Perfil privado" }

  /api/v1/entries/{entryId}/like:
    put:
      tags: [Social]
      summary: "Curtir a entrada"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Números depois de curtir"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryInteractionsResponse' }
    delete:
      tags: [Social]
      summary: "Tirar a curtida"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Números depois de tirar"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryInteractionsResponse' }

  /api/v1/entries/{entryId}/comments:
    get:
      tags: [Social]
      summary: "Respostas, mais antigas primeiro"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Respostas"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EntryCommentResponse' } }
    post:
      tags: [Social]
      summary: "Responder a entrada"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: "A resposta criada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryCommentResponse' }

  /api/v1/entries/{entryId}/comments/{commentId}:
    patch:
      tags: [Social]
      summary: "Editar uma resposta (só quem escreveu)"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: commentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: "A resposta editada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryCommentResponse' }
        '400': { description: "Texto vazio ou maior que 1000 caracteres" }
        '403': { description: "Só quem escreveu pode editar" }
    delete:
      tags: [Social]
      summary: "Apagar uma resposta (quem escreveu ou o dono da entrada)"
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: commentId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: "Apagada" }
        '403': { description: "Sem permissão" }

  /api/v1/feed:
    get:
      tags: [Social]
      summary: "Registros recentes de quem você segue (sem importações do Letterboxd)"
      parameters:
        - { in: query, name: before, required: false, schema: { type: string, format: date-time }, description: "Cursor: nextBefore da página anterior" }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: "Uma página do feed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedResponse' }

  /api/v1/activity:
    get:
      tags: [Social]
      summary: "Aba Amigos do sino: o que você e quem você segue fizeram (registros, seguiu, curtiu, respondeu)"
      parameters:
        - { in: query, name: before, required: false, schema: { type: string, format: date-time } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 25, maximum: 50 } }
      responses:
        '200':
          description: "Uma página"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }

  /api/v1/titles/{titleId}/community:
    get:
      tags: [Social]
      summary: "Página do título: nota consolidada (TMDB + CineDiary), amigos que assistiram e até 3 reviews em destaque"
      parameters:
        - { in: path, name: titleId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Lado social do título"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitleCommunityResponse' }

  /api/v1/titles/{titleId}/reviews:
    get:
      tags: [Social]
      summary: "Todas as reviews do título (perfis privados só para quem segue)"
      parameters:
        - { in: path, name: titleId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: sort, required: false, schema: { type: string, enum: [POPULAR, RECENT, FRIENDS], default: POPULAR } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: "Uma página"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TitleReview' }

  /api/v1/me/notifications:
    get:
      tags: [Social]
      summary: "Sino: avisos mais recentes (curtidas no mesmo registro agrupadas)"
      responses:
        '200':
          description: "Avisos"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotificationResponse' } }

  /api/v1/me/notifications/unread-count:
    get:
      tags: [Social]
      summary: "Quantos avisos não vistos (o número do sino)"
      responses:
        '200':
          description: "Contagem"
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, format: int64 }

  /api/v1/me/notifications/seen:
    post:
      tags: [Social]
      summary: "Marca todos os avisos como vistos (ao abrir o sino)"
      responses:
        '204': { description: "Marcados" }

  /api/v1/public/usernames/{username}/availability:
    get:
      tags: [Público]
      summary: "Se um @username está livre (sem login: cadastro, antes de criar a conta)"
      description: >
        Nome preso numa conta excluída ou abandonada (sem onboarding) conta como livre. Não reserva o nome:
        o Clerk confirma ao criar a conta.
      security: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Resultado da verificação"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'

  /api/v1/public/showcase:
    get:
      tags: [Público]
      summary: "Pôsteres populares no país e no idioma do aparelho (sem login: boas-vindas e animação do Match)"
      security: []
      parameters:
        - in: query
          name: region
          required: false
          description: "ISO 3166-1 (ex.: US). Inválido ou ausente = BR"
          schema:
            type: string
        - in: query
          name: language
          required: false
          description: "BCP 47 (ex.: en-US). Inválido ou ausente = pt-BR"
          schema:
            type: string
      responses:
        '200':
          description: "Até 12 pôsteres (cache de 6 h por país e idioma); vazio se o TMDB estiver fora"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowcasePoster'

  /api/v1/catalog/search:
    get:
      tags: [Catalog (TMDB)]
      summary: Busca filmes e séries no TMDB (pt-BR) com cache local no PostgreSQL
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [ALL, MOVIE, SERIES]
            default: ALL
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Resultados paginados do catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'

  /api/v1/catalog/popular:
    get:
      tags: [Catalog (TMDB)]
      summary: Lista títulos populares para o onboarding e tela Registrar
      parameters:
        - in: query
          name: genreIds
          required: false
          description: "IDs de gênero do TMDB (OU). Com eles, traz os populares desses gêneros (discover); sem resultado, cai nos populares gerais"
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [ALL, MOVIE, SERIES]
            default: MOVIE
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Títulos populares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'

  /api/v1/catalog/trending:
    get:
      tags: [Catalog (TMDB)]
      summary: Em alta esta semana (TMDB trending, igual para todos)
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [MOVIE, SERIES]
            default: MOVIE
      responses:
        '200':
          description: Títulos em alta nos últimos 7 dias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'

  /api/v1/recommendations/for-you:
    get:
      tags: [Recomendações]
      summary: "Para você: gente com gosto parecido (Neo4j) e populares dos gêneros que mais combinam com você"
      responses:
        '200':
          description: "Até 20 filmes que você ainda não viu nem pôs na watchlist; source diz de onde vieram"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForYouResponse'

  /api/v1/recommendations/because-you-liked:
    get:
      tags: [Recomendações]
      summary: "Porque você curtiu X: parecidos com um filme que você avaliou bem (gira entre os 3 mais amados)"
      responses:
        '200':
          description: "seed é nulo (e items vazio) enquanto não houver filme com nota alta"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BecauseYouLikedResponse'

  /api/v1/catalog/genres:
    get:
      tags: [Catalog (TMDB)]
      summary: Lista os gêneros cinematográficos suportados em PT-BR
      responses:
        '200':
          description: Lista de gêneros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreDto'

  /api/v1/catalog/{mediaType}/{tmdbId}:
    get:
      tags: [Catalog (TMDB)]
      summary: Detalhes completos de um filme ou série (incluindo temporadas e estado do usuário)
      parameters:
        - in: path
          name: mediaType
          required: true
          schema:
            $ref: '#/components/schemas/MediaType'
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalhes do título e estado atual do usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTitleDetailResponse'

  /api/v1/catalog/{mediaType}/{tmdbId}/credits:
    get:
      tags: [Catalog (TMDB)]
      summary: Direção (filmes) e elenco principal de um filme ou série
      parameters:
        - in: path
          name: mediaType
          required: true
          schema:
            $ref: '#/components/schemas/MediaType'
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Direção primeiro, depois o elenco na ordem de destaque do TMDB (até 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TitleCreditDto'

  /api/v1/catalog/{mediaType}/{tmdbId}/backdrops:
    get:
      tags: [Catalog (TMDB)]
      summary: "Backdrops sem texto do título, para escolher a capa do perfil (cache de 6 h)"
      parameters:
        - in: path
          name: mediaType
          required: true
          schema:
            $ref: '#/components/schemas/MediaType'
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Lista vazia quando o TMDB não tem imagens sem texto"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleBackdropsResponse'

  /api/v1/catalog/{mediaType}/{tmdbId}/extras:
    get:
      tags: [Catalog (TMDB)]
      summary: "Lançamento, país, produtoras, equipe, trailer, coleção, similares e onde assistir do título"
      parameters:
        - in: query
          name: language
          required: false
          description: "Idioma do aparelho (BCP 47, ex.: pt-BR), para escolher o trailer; ausente = pt-BR"
          schema:
            type: string
        - in: query
          name: region
          required: false
          description: "País do aparelho (ISO 3166-1, ex.: BR), para o onde assistir; ausente = o país do idioma"
          schema:
            type: string
        - in: path
          name: mediaType
          required: true
          schema:
            $ref: '#/components/schemas/MediaType'
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Dados do TMDB (cache de 6 h por título); listas vazias quando não há"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleExtrasResponse'

  /api/v1/catalog/series/{tmdbId}/seasons/{seasonNumber}:
    get:
      tags: [Catalog (TMDB)]
      summary: "Episódios de uma temporada: nome, data em que foi ao ar, duração, imagem e sinopse"
      parameters:
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: seasonNumber
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Temporada e episódios (cache de 12 h)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'

  /api/v1/catalog/series/{tmdbId}/seasons/{seasonNumber}/trailer:
    get:
      tags: [Catalog (TMDB)]
      summary: "Trailer da temporada no idioma do aparelho quando houver"
      parameters:
        - in: path
          name: tmdbId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: seasonNumber
          required: true
          schema:
            type: integer
        - in: query
          name: language
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "youtubeKey nulo quando a temporada não tem trailer"
          content:
            application/json:
              schema:
                type: object
                properties:
                  youtubeKey:
                    type: string
                    nullable: true

  /api/v1/catalog/companies/{companyId}:
    get:
      tags: [Catalog (TMDB)]
      summary: Produtora com os filmes dela, os mais populares primeiro
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Produtora e filmes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  /api/v1/catalog/people/{personId}:
    get:
      tags: [Catalog (TMDB)]
      summary: Pessoa com os títulos em que atuou e os que dirigiu
      parameters:
        - in: path
          name: personId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Filmografia sem duplicados, por popularidade, com o estado do usuário em cada título
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '404':
          description: Pessoa não encontrada no TMDB

  /api/v1/titles/{titleId}/state:
    put:
      tags: [Diary & Series]
      summary: Registro rápido (<= 3 toques) de estado independente (assistido, nota, like, watchlist)
      parameters:
        - in: path
          name: titleId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTitleStateRequest'
      responses:
        '200':
          description: Estado atualizado, evento publicado na Outbox (Neo4j) e Matches recalculados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTitleStateDto'

  /api/v1/watchlist:
    get:
      tags: [Diary & Series]
      summary: Lista os títulos na watchlist pessoal do usuário autenticado
      responses:
        '200':
          description: Watchlist pessoal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogTitleSummary'

  /api/v1/diary/undated:
    get:
      tags: [Diary & Series]
      summary: "Filmes já assistidos sem nenhuma entrada no diário (ex.: marcados no onboarding, ADR-04)"
      responses:
        '200':
          description: "Até 30 filmes, mais recentes primeiro; saem da lista quando ganham uma entrada com data"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogTitleSummary'

  /api/v1/diary/entries:
    get:
      tags: [Diary & Series]
      summary: Lista entradas cronológicas do diário do usuário, com filtros opcionais do "Meu diário"
      parameters:
        - $ref: '#/components/parameters/DiaryYear'
        - $ref: '#/components/parameters/DiaryMonth'
        - $ref: '#/components/parameters/DiaryGenreId'
        - $ref: '#/components/parameters/DiaryMinRating'
        - $ref: '#/components/parameters/DiaryRewatch'
        - $ref: '#/components/parameters/DiaryWithReview'
        - $ref: '#/components/parameters/DiaryMediaType'
        - $ref: '#/components/parameters/DiaryQuery'
        - in: query
          name: titleId
          required: false
          description: Só as entradas deste título (página do filme)
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de entradas do diário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiaryEntryResponse'
    post:
      tags: [Diary & Series]
      summary: Cria uma entrada no diário (suporta rewatch com datas diferentes e review textual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiaryEntryRequest'
      responses:
        '201':
          description: Entrada criada no diário e sincronizada via Outbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntryResponse'

  /api/v1/diary/entries/count:
    get:
      tags: [Diary & Series]
      summary: Quantos registros do diário passam nos filtros
      parameters:
        - $ref: '#/components/parameters/DiaryYear'
        - $ref: '#/components/parameters/DiaryMonth'
        - $ref: '#/components/parameters/DiaryGenreId'
        - $ref: '#/components/parameters/DiaryMinRating'
        - $ref: '#/components/parameters/DiaryRewatch'
        - $ref: '#/components/parameters/DiaryWithReview'
        - $ref: '#/components/parameters/DiaryMediaType'
        - $ref: '#/components/parameters/DiaryQuery'
      responses:
        '200':
          description: Total de registros com esses filtros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryCountResponse'

  /api/v1/diary/filters:
    get:
      tags: [Diary & Series]
      summary: Opções dos filtros do diário (só o que existe nele) — anos, gêneros com quantos registros e tipos
      responses:
        '200':
          description: Anos com registro (do mais recente), gêneros (dos mais registrados) e totais de filmes e séries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryFiltersResponse'

  /api/v1/diary/entries/{entryId}:
    parameters:
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Diary & Series]
      summary: Uma entrada do diário (só o dono)
      responses:
        '200':
          description: A entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntryResponse'
        '404':
          description: Não existe ou é de outra pessoa
    put:
      tags: [Diary & Series]
      summary: Edita data, nota, curtida, rever, review e spoiler (substitui todos; rating null = sem nota)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDiaryEntryRequest'
      responses:
        '200':
          description: A entrada editada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntryResponse'
    delete:
      tags: [Diary & Series]
      summary: Exclui a entrada (o título continua marcado como visto)
      responses:
        '204':
          description: Excluída

  /api/v1/series/{titleId}/episodes:
    put:
      tags: [Diary & Series]
      summary: Marca ou desmarca episódios/temporadas assistidos e atualiza progresso da série
      parameters:
        - in: path
          name: titleId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesEpisodeProgressRequest'
      responses:
        '200':
          description: Progresso da série atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesProgressResponse'

  /api/v1/imports/letterboxd:
    post:
      tags: [Importing (Letterboxd)]
      summary: Envia o arquivo ZIP exportado do Letterboxd e inicia job assíncrono
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Job de importação iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'

  /api/v1/imports/{jobId}:
    get:
      tags: [Importing (Letterboxd)]
      summary: Consulta status e resumo pré-confirmação da importação
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado atual e resumo da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'

  /api/v1/imports/{jobId}/confirm:
    post:
      tags: [Importing (Letterboxd)]
      summary: Confirma a importação e grava os registros em segundo plano, de forma idempotente
      description: >
        Responde na hora com o job em APPLYING; a gravação no diário roda em segundo plano e o job termina em
        COMPLETED (ou FAILED). Acompanhe por GET /api/v1/imports/{jobId}. Confirmar de novo um job em APPLYING
        ou COMPLETED devolve o job como está, sem duplicar nada.
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmImportRequest'
      responses:
        '200':
          description: Importação confirmada (APPLYING), ou o job como está se já estava em gravação ou concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'

  /api/v1/users/{username}/stats:
    get:
      tags: [Stats]
      summary: Retorna perfil público/privado e estatísticas gratuitas (gêneros, média, filmes/mês)
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estatísticas do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'

  /api/v1/matches:
    get:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Lista os Taste Matches do usuário (PENDING, BUILDING e ACTIVE)
      responses:
        '200':
          description: Lista de Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TasteMatchSummaryResponse'
    post:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Cria um novo Taste Match e gera link/código de convite
      responses:
        '201':
          description: Match criado no estado PENDING ("Aguardando seu amigo")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasteMatchSummaryResponse'

  /api/v1/matches/{inviteCode}/accept:
    post:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Aceita convite de Taste Match e executa cálculo no Neo4j + GDS
      parameters:
        - in: path
          name: inviteCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match ativado (ou em BUILDING se faltar histórico) e calculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStoryResponse'

  /api/v1/matches/{matchId}:
    delete:
      tags: [Taste Match (Neo4j + GDS)]
      summary: "Sai do Match: encerra para os dois e apaga a lista de vocês (convite pendente = cancela)"
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Encerrado (sair de novo também devolve 204)
        '403':
          description: Você não participa deste Match

  /api/v1/matches/{matchId}/story:
    get:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Retorna os 8 slides do Match Story (9:16) e a explicação detalhada da porcentagem via Neo4j GDS
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dados completos do Match Story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStoryResponse'

  /api/v1/matches/{matchId}/story/seen:
    put:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Marca o Story como visto, na conta (marcar de novo não muda nada)
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204': { description: "Marcado como visto" }
        '403': { description: "Você não participa deste Match" }
        '404': { description: "Match não encontrado ou encerrado" }

  /api/v1/matches/{matchId}/watchlist:
    get:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Lista a watchlist compartilhada do Taste Match
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Títulos da watchlist compartilhada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharedWatchlistItemResponse'
    post:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Adiciona um título à watchlist compartilhada do Match
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titleId]
              properties:
                titleId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Adicionado à watchlist compartilhada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedWatchlistItemResponse'

  /api/v1/matches/{matchId}/watchlist/{titleId}:
    delete:
      tags: [Taste Match (Neo4j + GDS)]
      summary: Remove um título da watchlist compartilhada do Match
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: titleId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Removido da watchlist compartilhada

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DiaryYear:
      in: query
      name: year
      required: false
      description: Ano em que assistiu
      schema: { type: integer }
    DiaryMonth:
      in: query
      name: month
      required: false
      description: Mês (1–12), só junto com o ano
      schema: { type: integer, minimum: 1, maximum: 12 }
    DiaryGenreId:
      in: query
      name: genreId
      required: false
      description: Gênero do TMDB do título
      schema: { type: integer }
    DiaryMinRating:
      in: query
      name: minRating
      required: false
      description: Nota a partir de (0,5–5)
      schema: { type: number, minimum: 0.5, maximum: 5 }
    DiaryRewatch:
      in: query
      name: rewatch
      required: false
      description: Só revistos
      schema: { type: boolean, default: false }
    DiaryWithReview:
      in: query
      name: withReview
      required: false
      description: Só com review
      schema: { type: boolean, default: false }
    DiaryMediaType:
      in: query
      name: mediaType
      required: false
      description: MOVIE ou SERIES (sem o parâmetro, os dois)
      schema: { type: string, enum: [MOVIE, SERIES] }
    DiaryQuery:
      in: query
      name: q
      required: false
      description: Parte do título, sem diferenciar maiúsculas nem acentos (até 100 caracteres)
      schema: { type: string, maxLength: 100 }
  schemas:
    ActivityResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, kind, actor, createdAt]
            properties:
              id: { type: string }
              kind: { type: string, enum: [LOGGED, FOLLOWED, LIKED_ENTRY, REPLIED_ENTRY, WATCHLISTED] }
              actor: { $ref: '#/components/schemas/FeedAuthor' }
              target:
                allOf: [{ $ref: '#/components/schemas/FeedAuthor' }]
                nullable: true
                description: "Quem foi seguido / dono da review curtida ou respondida"
              entry:
                allOf: [{ $ref: '#/components/schemas/DiaryEntryResponse' }]
                nullable: true
              commentText: { type: string, nullable: true }
              title:
                allOf: [{ $ref: '#/components/schemas/CatalogTitleSummary' }]
                nullable: true
                description: "Só em WATCHLISTED (quer ver)"
              createdAt: { type: string, format: date-time }
        nextBefore: { type: string, format: date-time, nullable: true }
    TitleReview:
      type: object
      required: [entry, author, likeCount, commentCount]
      properties:
        entry: { $ref: '#/components/schemas/DiaryEntryResponse' }
        author: { $ref: '#/components/schemas/FeedAuthor' }
        likeCount: { type: integer, format: int64 }
        commentCount: { type: integer, format: int64 }
    TitleCommunityResponse:
      type: object
      required: [friends, reviews, reviewCount]
      properties:
        rating:
          type: object
          nullable: true
          description: "Nota única de 0,5 a 5 juntando TMDB e CineDiary; ausente = ninguém deu nota"
