          items:
            type: string
        watchlistCount:
          type: integer
        reviewsCount:
          type: integer
        diaryEntriesCount:
          type: integer
        diaryEntriesCreated:
          type: integer
          nullable: true
        diaryEntriesSkipped:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        preview:
          type: array
          description: "Até 10 títulos encontrados (só em AWAITING_CONFIRMATION)"
          items:
            $ref: '#/components/schemas/CatalogTitleSummary'
        ratedCount:
          type: integer
        likedCount:
          type: integer
        favoritesInApp:
          type: array
          description: "Favoritos atuais no app (só em AWAITING_CONFIRMATION)"
          items:
            $ref: '#/components/schemas/CatalogTitleSummary'
        favoritesFromImport:
          type: array
          description: "Favoritos do perfil do Letterboxd, na ordem de lá (só em AWAITING_CONFIRMATION)"
          items:
            $ref: '#/components/schemas/CatalogTitleSummary'

    ConfirmImportRequest:
      type: object
      properties:
        favoritesMode:
          type: string
          enum: [KEEP, REPLACE, MERGE]
          description: "Sem valor = REPLACE. Só importa quando os dois lados têm favoritos (máximo de 4)"

    UserStatsResponse:
      type: object
      required: [totalMoviesWatched, totalSeriesWatched, averageRating, topGenres, moviesPerMonth]
      properties:
        totalMoviesWatched:
          type: integer
        totalSeriesWatched:
          type: integer
        averageRating:
          type: number
        topGenres:
          type: array
          items:
            type: object
            required: [genreName, count]
            properties:
              genreName:
                type: string
              count:
                type: integer
        moviesPerMonth:
          type: array
          items:
            type: object
            required: [yearMonth, count]
            properties:
              yearMonth:
                type: string
                example: "2026-11"
              count:
                type: integer

    MatchPerson:
      type: object
      description: "Uma pessoa do Match (quem criou ou o parceiro), só com os dados públicos."
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
    TasteMatchSummaryResponse:
      type: object
      required: [id, inviteCode, inviteUrl, status, statusLabel, creator]
      properties:
        id:
          type: string
          format: uuid
        inviteCode:
          type: string
        inviteUrl:
          type: string
        status:
          $ref: '#/components/schemas/MatchStatus'
        statusLabel:
          type: string
          example: "Aguardando seu amigo"
        creator:
          $ref: '#/components/schemas/MatchPerson'
        partner:
          $ref: '#/components/schemas/MatchPerson'
        compatibilityScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        discoveryMode:
          type: boolean
        sharedWatchlistCount:
          type: integer

    MatchStoryResponse:
      type: object
      required: [matchId, status, statusLabel, discoveryMode, engineUsed, creator, scoreBreakdown, commonGenres, bothLoved, disagreements, discoveryPicks, jointRecommendations, seenByMe]
      properties:
        matchId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/MatchStatus'
        statusLabel:
          type: string
          example: "Match ativo"
        compatibilityScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        discoveryMode:
          type: boolean
          description: True quando a dupla possui < 3 títulos avaliados em comum
        engineUsed:
          type: string
          enum: [NEO4J_GDS, SQL_FALLBACK]
        creator:
          $ref: '#/components/schemas/MatchPerson'
        partner:
          $ref: '#/components/schemas/MatchPerson'
        scoreBreakdown:
          type: object
          required: [ratingsScore, ratingsWeight, genresScore, genresWeight, favoritesScore, favoritesWeight, commonRatedCount, explanationText]
          properties:
            ratingsScore:
              type: number
            ratingsWeight:
              type: number
              example: 0.50
            genresScore:
              type: number
            genresWeight:
              type: number
              example: 0.30
            favoritesScore:
              type: number
            favoritesWeight:
              type: number
              example: 0.20
            commonRatedCount:
              type: integer
            explanationText:
              type: string
        commonGenres:
          type: array
          items:
            type: string
        bothLoved:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTitleSummary'
        disagreements:
          type: array
          items:
            type: object
            required: [title, creatorRating, partnerRating]
            properties:
              title:
                $ref: '#/components/schemas/CatalogTitleSummary'
              creatorRating:
                type: number
              partnerRating:
                type: number
        discoveryPicks:
          type: array
          description: "O que um ama e o outro ainda não viu"
          items:
            type: object
            required: [recommendedByUserId, recommendedByName, title]
            properties:
              recommendedByUserId:
                type: string
                format: uuid
              recommendedByName:
                type: string
              title:
                $ref: '#/components/schemas/CatalogTitleSummary'
        jointRecommendations:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTitleSummary'
        seenByMe:
          type: boolean
          description: "Você já viu o Story (em qualquer aparelho): o app só mostra o \"Calculando…\" na primeira vez"

    SharedWatchlistItemResponse:
      type: object
      required: [title, addedByUserId, addedByName, addedByBoth, addedAt]
      properties:
        title:
          $ref: '#/components/schemas/CatalogTitleSummary'
        addedByUserId:
          type: string
          format: uuid
        addedByName:
          type: string
        addedByBoth:
          type: boolean
          description: "Sugestão do Story \"para verem juntos\": o app mostra o rosto dos dois"
        addedAt:
          type: string
          format: date-time
